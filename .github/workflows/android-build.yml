name: Android Build From ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' | sort | tail -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP project found."
            exit 1
          fi
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Using: $ZIP_FILE"

      - name: Extract project ZIP
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q "${{ steps.zip.outputs.zip }}" -d extracted
          echo "Extracted project:"
          find extracted -maxdepth 3 -type f | sort | head -100

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        working-directory: extracted
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifact
          cp extracted/app/build/outputs/apk/debug/app-debug.apk artifact/HeroLife-Stage01.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeroLife-Stage01
          path: artifact/HeroLife-Stage01.apk
